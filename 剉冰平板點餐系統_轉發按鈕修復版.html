<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>剉冰｜平板點餐與出餐</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#213047;background:#edf3f8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;border:0;border-radius:12px;padding:12px;font-weight:750}button:disabled{opacity:.45}button{position:relative;z-index:1;-webkit-tap-highlight-color:transparent;user-select:none}header{height:64px;background:#173c60;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px}header h1{font-size:21px;margin:0}.shell{height:calc(100dvh - 64px);display:grid;grid-template-columns:47% 53%;gap:12px;padding:12px}.pane{background:white;border-radius:18px;min-height:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 3px 14px #1232}.pane-head{padding:14px 18px;border-bottom:1px solid #e5eaf0;display:flex;align-items:center;justify-content:space-between}.pane-head h2{font-size:20px;margin:0}.scroll{overflow:auto;min-height:0;flex:1;padding:14px 18px;overscroll-behavior:contain}.footer{border-top:1px solid #e5eaf0;padding:12px 18px;background:white}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#697789;font-size:13px}.label{font-weight:750;margin:10px 0 8px}.number{width:100%;padding:14px;border:2px solid #d5e0ea;border-radius:12px;font-size:20px}.flavors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.flavor{background:#f3f6fa;border:2px solid transparent;min-height:75px}.flavor.active{background:#e6f2ff;border-color:#2979c9}.toggle{background:#f1f5f9}.toggle.active{background:#d7edfc;color:#12579c}.primary{background:#176eb4;color:white}.success{background:#17805a;color:white}.secondary{background:#e9eef4;color:#213047}.danger{background:#fff0f0;color:#a62d38}.wide{width:100%}.qty{display:flex;align-items:center;gap:10px}.qty button{min-width:45px}.cartitem,.order{border:1px solid #e0e7ee;border-radius:12px;padding:12px;margin-bottom:9px}.order{border-left:5px solid #e9a23b}.order.making{border-left-color:#2883c7}.order.done{border-left-color:#17946a}.tag{background:#edf3f8;border-radius:100px;padding:4px 9px;font-size:12px}.money{font-size:23px;font-weight:850;color:#135d9d}.note{font-size:13px;color:#5e7084;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.filters{display:flex;gap:5px}.filters button{padding:8px 10px;font-size:13px}.filters .active{background:#176eb4;color:white}.summary{background:#edf6ff;padding:12px;border-radius:12px;margin-top:10px}.checkline{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:15px}.checkline input{width:22px;height:22px}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f0f5fa;padding:14px;border-radius:12px}.stat strong{display:block;font-size:23px}.hidden{display:none!important}#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#20384f;color:white;padding:10px 20px;border-radius:12px;display:none;z-index:5}#stats{position:fixed;inset:0;background:#edf3f8;z-index:4;display:none;padding:14px;overflow:auto}#stats.show{display:block}.statscard{max-width:950px;margin:auto;background:white;padding:22px;border-radius:18px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e5eaf0;padding:11px}th:last-child,td:last-child{text-align:right}@media(max-width:650px){header{height:58px}.shell{height:calc(100dvh - 58px);grid-template-columns:1fr 1fr;gap:6px;padding:6px}.pane-head{padding:9px}.pane-head h2{font-size:16px}.scroll{padding:9px}.footer{padding:8px}.flavors{grid-template-columns:1fr}.flavor{min-height:44px}.row{flex-wrap:wrap}.filters{flex-wrap:wrap}button{padding:9px}.statgrid{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>🍧 剉冰點餐系統</h1><button class="secondary" id="openStats">📊 營業統計</button></header><main class="shell"><section class="pane"><div class="pane-head"><h2>① 點餐／收款</h2><span class="tag">先收原價</span></div><div class="scroll"><div class="label">等候號碼（手動輸入）</div><input id="ticket" class="number" placeholder="例如 28" maxlength="15" autocomplete="off"><div class="label">選擇口味</div><div class="flavors"><button class="flavor active" data-flavor="草莓">🍓 草莓<br>$45</button><button class="flavor" data-flavor="百香果">🥭 百香果<br>$45</button><button class="flavor" data-flavor="黑糖">🍯 黑糖<br>$45</button></div><div class="label">椰果</div><div class="row"><button id="coconut" class="toggle">不加椰果</button><span class="muted">加椰果 +$5／碗</span></div><div class="label">數量</div><div class="row"><div class="qty"><button id="minus" class="secondary">−</button><strong id="qty">1</strong><button id="plus" class="secondary">＋</button></div><button id="add" class="primary">＋ 加入品項</button></div><div class="label">本筆訂單</div><div id="cart"></div></div><div class="footer"><div class="row"><span>先收金額（不扣促銷）</span><strong id="total" class="money">$0</strong></div><button id="submit" class="primary wide" style="margin-top:10px">確認已收款並送出訂單</button></div></section><section class="pane"><div class="pane-head"><h2>② 出餐／退費</h2><div class="filters"><button data-filter="active" class="active">待處理</button><button data-filter="done">已出餐</button><button data-filter="all">全部</button></div></div><div id="orderList" class="scroll"></div><div class="footer"><div class="row"><span class="muted">完成出餐後點「不轉發」或「已轉發／已退款」，點擊即記錄，不會跳出確認視窗</span><strong id="pendingCount">待出餐 0 筆</strong></div></div></section></main><div id="stats"><div class="statscard"><div class="row"><h2>📊 今日營業統計</h2><button class="secondary" id="closeStats">返回點餐</button></div><div id="statsBody"></div><div class="actions"><button class="primary" id="export">匯出 CSV 銷售明細</button><button class="secondary" id="exportBackup">備份 JSON</button><button class="danger" id="clear">清空所有訂單（需確認）</button></div><p class="note">訂單保存在此裝置、此瀏覽器的本機儲存空間。請定期匯出備份，勿使用無痕模式或清除網站資料。</p></div></div><div id="toast"></div><script>
(function(){'use strict';const KEY='ice_pos_tablet_refund_v1';let orders=[];try{orders=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(orders))orders=[]}catch(e){orders=[]}let cart=[],flavor='草莓',coconut=false,quantity=1,filter='active';const $=id=>document.getElementById(id);const money=n=>'$'+n.toLocaleString('zh-TW');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(orders))}catch(e){alert('儲存失敗，請檢查瀏覽器儲存空間！')}};function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function sum(items){return items.reduce((a,x)=>a+x.qty*(45+(x.coconut?5:0)),0)}function count(items){return items.reduce((a,x)=>a+x.qty,0)}function discount(o){return Math.floor(count(o.items)/2)*10}function renderCart(){const root=$('cart');root.innerHTML=cart.length?cart.map((x,i)=>`<div class="cartitem"><div class="row"><div><strong>${esc(x.flavor)} × ${x.qty}</strong><div class="muted">${x.coconut?'加椰果':'不加椰果'} · ${money(x.qty*(45+(x.coconut?5:0)))}</div></div><div class="qty"><button class="secondary" data-cart="${i}" data-delta="-1">−</button><button class="secondary" data-cart="${i}" data-delta="1">＋</button></div></div></div>`).join(''):'<p class="muted">尚未加入品項</p>';$('total').textContent=money(sum(cart));$('qty').textContent=quantity}function renderOrders(){const view=orders.filter(o=>filter==='all'||(filter==='active'&&(o.status!=='done'||(o.status==='done'&&!o.promoClosed)))||(filter==='done'&&o.status==='done'));$('orderList').innerHTML=view.length?view.map(o=>{const d=discount(o),done=o.status==='done';return `<article class="order ${o.status}"><div class="row"><div><strong style="font-size:22px">號碼 ${esc(o.ticket)}</strong><span class="tag" style="margin-left:7px">${done?'已出餐':o.status==='making'?'製作中':'等候中'}</span></div><span class="muted">${esc(o.time)}</span></div><div style="margin:9px 0">${o.items.map(x=>`<div class="row" style="margin:5px 0"><span>${esc(x.flavor)} × ${x.qty} <span class="muted">${x.coconut?'＋椰果':''}</span></span><strong>${money(x.qty*(45+(x.coconut?5:0)))}</strong></div>`).join('')}</div><div class="summary"><div class="row"><span>已收原價</span><strong>${money(o.gross)}</strong></div><div class="row"><span>轉發可退</span><strong>${money(d)}</strong></div><div class="row"><span>實際退款</span><strong>${money(o.refund||0)}</strong></div><div class="row"><span>實收淨額</span><strong>${money(o.gross-(o.refund||0))}</strong></div></div>${done?`<div class="actions" style="display:flex;flex-wrap:wrap;gap:8px"><button class="secondary" data-status="waiting" data-id="${o.id}">恢復待出餐</button>${o.promoClosed?`<span class="tag" style="padding:12px">${o.refunded?'已轉發並退款 '+money(d):'未參加轉發優惠 · 無退款'}</span><button class="secondary" data-promo="reset" data-id="${o.id}">更正優惠紀錄</button>`:`<button class="secondary" data-promo="none" data-id="${o.id}">不轉發｜完成紀錄</button>${d>0?`<button class="success" data-promo="refund" data-id="${o.id}">✓ 已轉發／已退 ${money(d)}</button>`:''}`}</div>`:`<div class="actions">${o.status==='waiting'?`<button class="secondary" data-status="making" data-id="${o.id}">開始製作</button>`:''}<button class="success" data-status="done" data-id="${o.id}">✓ 完成出餐</button></div>`}</article>`}).join(''):'<p class="muted">目前沒有符合條件的訂單</p>';$('pendingCount').textContent='待出餐 '+orders.filter(o=>o.status!=='done').length+' 筆 · 待退款 '+orders.filter(o=>o.status==='done'&&!o.promoClosed).length+' 筆'}function renderStats(){let counts={'草莓':0,'百香果':0,'黑糖':0},coco=0,gross=0,refund=0,cups=0;for(const o of orders){gross+=o.gross;refund+=o.refund||0;for(const x of o.items){counts[x.flavor]=(counts[x.flavor]||0)+x.qty;cups+=x.qty;if(x.coconut)coco+=x.qty}}$('statsBody').innerHTML=`<div class="statgrid"><div class="stat">總售出杯數<strong>${cups}</strong></div><div class="stat">訂單筆數<strong>${orders.length}</strong></div><div class="stat">已完成出餐<strong>${orders.filter(x=>x.status==='done').length}</strong></div><div class="stat">原價收款<strong>${money(gross)}</strong></div><div class="stat">已退促銷款<strong>${money(refund)}</strong></div><div class="stat">實際營收<strong>${money(gross-refund)}</strong></div></div><h3>品項銷量</h3><table><tr><th>品項</th><th>杯數／金額</th></tr>${Object.entries(counts).map(([k,v])=>`<tr><td>${k}</td><td>${v} 杯／${money(v*45)}</td></tr>`).join('')}<tr><td>加椰果</td><td>${coco} 份／${money(coco*5)}</td></tr></table><p class="note">營收＝原價收款－已完成的促銷退款；未退的促銷不扣除。刪除／取消訂單功能尚未提供，輸錯訂單請先避免重複登記並使用備份留存。</p>`}document.querySelectorAll('[data-flavor]').forEach(b=>b.onclick=()=>{flavor=b.dataset.flavor;document.querySelectorAll('[data-flavor]').forEach(x=>x.classList.toggle('active',x===b))});$('coconut').onclick=()=>{coconut=!coconut;$('coconut').classList.toggle('active',coconut);$('coconut').textContent=coconut?'✓ 加椰果 +$5':'不加椰果'};$('minus').onclick=()=>{quantity=Math.max(1,quantity-1);renderCart()};$('plus').onclick=()=>{quantity++;renderCart()};$('add').onclick=()=>{let x=cart.find(x=>x.flavor===flavor&&x.coconut===coconut);if(x)x.qty+=quantity;else cart.push({flavor,coconut,qty:quantity});quantity=1;renderCart();toast('已加入品項')};$('cart').onclick=e=>{let b=e.target.closest('[data-cart]');if(!b)return;let i=Number(b.dataset.cart);cart[i].qty+=Number(b.dataset.delta);cart=cart.filter(x=>x.qty>0);renderCart()};$('submit').onclick=()=>{let ticket=$('ticket').value.trim();if(!ticket)return alert('請先輸入等候號碼');if(!cart.length)return alert('請先加入品項');if(orders.some(o=>o.ticket===ticket&&o.status!=='done'))return alert('此號碼已有未完成訂單，請確認');orders.unshift({id:String(Date.now())+Math.random().toString(36).slice(2),ticket,items:cart.map(x=>({...x})),gross:sum(cart),refund:0,refunded:false,promoClosed:false,status:'waiting',time:new Date().toLocaleString('zh-TW')});save();cart=[];$('ticket').value='';renderCart();renderOrders();toast('登記成功，已收原價')};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderOrders()});$('orderList').onclick=e=>{const p=e.target.closest('[data-promo]');if(p){const o=orders.find(x=>x.id===p.dataset.id);if(!o||o.status!=='done')return;if(p.dataset.promo==='refund'){const d=discount(o);if(d<=0)return;o.refunded=true;o.refund=d;o.promoClosed=true;}else if(p.dataset.promo==='none'){o.refunded=false;o.refund=0;o.promoClosed=true;}else if(p.dataset.promo==='reset'){o.refunded=false;o.refund=0;o.promoClosed=false;}save();renderOrders();return}const b=e.target.closest('[data-status]');if(!b)return;const o=orders.find(x=>x.id===b.dataset.id);if(!o)return;if(b.dataset.status==='waiting'&&o.refunded){alert('請先更正退款紀錄，才能恢復待出餐');return}o.status=b.dataset.status;if(o.status==='waiting')o.promoClosed=false;save();renderOrders()};$('openStats').onclick=()=>{$('stats').classList.add('show');renderStats()};$('closeStats').onclick=()=>$('stats').classList.remove('show');function download(name,content,type){const blob=new Blob(['\ufeff',content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('export').onclick=()=>{const rows=[['等候號碼','時間','品項','椰果','數量','原價金額','整筆折扣退款','整筆實收','狀態','已退費','優惠處理']];for(const o of orders)for(const [i,x] of o.items.entries())rows.push([o.ticket,o.time,x.flavor,x.coconut?'是':'否',x.qty,x.qty*(45+(x.coconut?5:0)),i===0?o.refund:0,i===0?o.gross-o.refund:'',o.status,o.refunded?'是':'否',o.promoClosed?(o.refunded?'已退款':'未轉發'):'未結案']);download('剉冰銷售明細.csv',rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};$('exportBackup').onclick=()=>download('剉冰訂單備份.json',JSON.stringify(orders,null,2),'application/json');$('clear').onclick=()=>{if(prompt('要清空所有訂單，請輸入「確認清空」')!=='確認清空')return;orders=[];save();renderOrders();renderStats();toast('已清空')};renderCart();renderOrders()})();
</script></body></html>
